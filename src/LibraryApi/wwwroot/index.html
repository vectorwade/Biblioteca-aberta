<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Biblioteca Aberta - UI</title>
  <style>
    body{font-family:Segoe UI,Arial;margin:20px}
    .row{display:flex;gap:12px}
    .card{border:1px solid #ddd;padding:12px;border-radius:6px;margin-top:12px}
    input,button{padding:8px;margin:4px}
    #results img{height:120px}
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <h1>Biblioteca Aberta</h1>

  <section class="card">
    <h3>Usuário</h3>
    <div class="row">
      <input id="username" placeholder="Nome de usuário" />
      <input id="displayname" placeholder="Nome para exibição" />
      <button id="btnRegister">Registrar</button>
      <select id="userSelect"><option value="">-- selecione usuário --</option></select>
    </div>
  </section>

  <section class="card">
    <h3>Buscar livros</h3>
    <div class="row">
      <input id="q" placeholder="Digite título, autor, ISBN..." style="flex:1" />
      <button id="btnSearch">Buscar</button>
    </div>
    <div id="results"></div>
  </section>

  <section class="card">
    <h3>Livros gratuitos para download</h3>
    <div class="row">
      <input id="qfree" placeholder="Buscar livros gratuitos..." style="flex:1" />
      <button id="btnSearchFree">Buscar gratuitos</button>
    </div>
    <div id="freeResults"></div>
  </section>

  <section class="card">
    <h3>Wishlist</h3>
    <div id="wishlist"></div>
  </section>

  <section class="card">
    <h3>Histórico de Busca</h3>
    <div id="history"></div>
  </section>

  <section class="card">
    <h3>Ranking de Leitores</h3>
    <div id="ranking"></div>
  </section>

</body>
</html>
